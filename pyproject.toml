[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rbac-benchmark"
version = "0.1.0"
description = "Tool-Calling RBAC Resilience Benchmark — auditing the LLM 'Control Illusion' under tool-output prompt injection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.2.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.5.0",
    "streamlit>=1.57.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
rbac-master = "rbac_benchmark.orchestration.master_node:main_cli"
rbac-worker = "rbac_benchmark.worker.node:start_worker"
rbac-analyze = "rbac_benchmark.evaluation.analyzer:main"
rbac-kappa = "rbac_benchmark.evaluation.kappa_validation:_main"
rbac-gen-injections = "rbac_benchmark.generation.injection_generator:main"
rbac-gen-defenses = "rbac_benchmark.generation.defense_generator:main"
rbac-dashboard = "rbac_benchmark.ui.launch:main"

[tool.setuptools.packages.find]
include = ["rbac_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
